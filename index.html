<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="site/wp-content/uploads/2026/10/saida-site-icon-150x150.png">
<link rel="apple-touch-icon" href="site/wp-content/uploads/2026/10/saida-site-icon-300x300.png">
<title>Saida Foods Website</title>
<style>
@font-face{font-family:Cairo;src:url(site/wp-content/themes/saida/assets/fonts/Cairo.woff) format("woff");font-weight:200 900;font-display:swap}
@font-face{font-family:Poppins;src:url(site/wp-content/themes/saida/assets/fonts/Poppins-SemiBold.woff) format("woff");font-weight:600;font-display:swap}
:root{--bg:#FFF6E9;--ink:#14204A;--muted:#525A7C;--navy:#223F94;--gold:#E3A33B;--card:#FFFFFF;--line:rgba(20,32,74,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#FFF6E9;--ink:#14204A;--muted:#525A7C;--card:#FFFFFF}}
:root[data-theme="dark"]{--bg:#FFF6E9;--ink:#14204A;--muted:#525A7C;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 16px;background-image:radial-gradient(circle at 15% 10%,rgba(227,163,59,.22),transparent 40%),radial-gradient(circle at 90% 90%,rgba(34,63,148,.14),transparent 45%)}
main{width:100%;max-width:520px;background:var(--card);border-radius:28px;padding:40px 28px;text-align:center;box-shadow:0 30px 70px -30px rgba(20,32,74,.35)}
img{width:150px;height:auto}
h1{font-size:clamp(1.5rem,5vw,2rem);margin:18px 0 6px;line-height:1.3}
p{color:var(--muted);margin:0 0 28px;line-height:1.7}
.langs{display:grid;gap:12px}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-radius:16px;text-decoration:none;font-weight:700;font-size:1.05rem;border:1px solid var(--line);color:var(--ink);transition:transform .25s,box-shadow .25s,background .25s}
a:hover,a:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(34,63,148,.45);outline:none}
a.main{background:var(--navy);color:#fff;border-color:var(--navy)}
a span{font-family:Poppins,Cairo,sans-serif;font-size:.85rem;opacity:.75;font-weight:600}
.en,.de{direction:ltr;font-family:Poppins,Cairo,sans-serif}
</style>
</head>
<body>
<main>
  <img src="site/wp-content/themes/saida/assets/img/brand/logo.webp" alt="Saida Foods">
  <h1>الموقع الجديد لصيدا</h1>
  <p>اختر لغة العرض</p>
  <nav class="langs">
    <a class="main" href="site/ar/index.html">العربية <span>AR</span></a>
    <a class="en" href="site/index.html">English <span>EN</span></a>
    <a class="de" href="site/de/index.html">Deutsch <span>DE</span></a>
  </nav>
</main>
</body>
</html>
